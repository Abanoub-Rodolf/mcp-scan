name: Publish to npm

on:
  push:
    tags: [ 'v*' ]

jobs:
  # A tag push does not wait for ci.yml, so the release re-runs the gates
  # itself and publish cannot start unless they pass.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
    - run: npm ci
    - run: npm run build
    - run: npm test
    - run: npm run lint

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # for npm provenance
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        # node 24 ships npm >= 11.5.1, required for OIDC trusted-publisher
        # token exchange (npm 10 fails with E404 on the registry PUT).
        node-version: 24.x
        registry-url: 'https://registry.npmjs.org'
        cache: 'npm'
    - run: npm ci
    - run: npm run build
    - name: Publish to npm
      # No NODE_AUTH_TOKEN: authentication uses the OIDC trusted publisher
      # configured on npmjs.com for this repository + workflow (npm >= 9.5).
      run: npm publish --provenance --access public
