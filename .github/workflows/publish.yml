name: Publish to npm

on:
  push:
    tags: [ 'v*' ]

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # for npm provenance
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        registry-url: 'https://registry.npmjs.org'
        cache: 'npm'
    - run: npm ci
    - run: npm run build
    - name: Publish to npm
      # No NODE_AUTH_TOKEN: authentication uses the OIDC trusted publisher
      # configured on npmjs.com for this repository + workflow (npm >= 9.5).
      run: npm publish --provenance --access public
