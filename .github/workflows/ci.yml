name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Node 18 is excluded: vitest 4 / vite 8 require ^20.19.0 || >=22.12.0
        # (the runtime still supports Node 18, hence engines: ">=18").
        node-version: [20.x, 22.x]
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    # Same commands and order as .gitlab-ci.yml (canonical). Change both.
    - run: npm run lint
    - run: npm run typecheck
    - run: npm run build
    - name: Shipped action bundle is current
      run: |
        npm run build:action
        git diff --exit-code action/dist
        test -z "$(git status --porcelain action/dist)"
    - run: npm test
    - name: Dependency audit (runtime dependencies only, --omit=dev; blocks on high)
      run: node scripts/audit-gate.mjs
