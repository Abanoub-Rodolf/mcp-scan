default:
  before_script:
    - npm ci
  # Runner-side failures only (image pull DNS timeouts, runner lost).
  # script_failure is deliberately absent so a real red test is never retried
  # into green. stuck_or_timeout_failure is absent too: a job that hit its
  # timeout would just burn the timeout again on each retry.
  retry:
    max: 2
    when:
      - runner_system_failure
      - runner_external_dependency_failure
      - api_failure

stages:
  - quality
  - build
  - test
  - audit
  - ecosystem

variables:
  NODE_VERSION: "20"

# Node 18 is excluded from the CI matrix because vitest@4 / vite@8 require
# Node ^20.19.0 || >=22.12.0 (rolldown imports `node:util` `styleText`,
# added in Node 20). Runtime dependencies of mcp-scan still work on Node 18,
# which is why `engines: ">=18"` stays in package.json — the dev/test
# toolchain just needs 20+.
.node-matrix:
  parallel:
    matrix:
      - NODE_VERSION: ["20", "22"]

# Jobs need explicit rules, otherwise the implicit default (`only: branches,
# tags`) never ran them on a merge_request_event pipeline and an MR showed
# nothing but the manual ecosystem-scan job. The tag rule is required too:
# $CI_COMMIT_BRANCH is unset on a tag pipeline, so without it a release tag
# would silently drop lint/build/test/audit entirely.
#
# workflow:rules below stops a branch with an open MR from also running a
# push pipeline: the MR pipeline already covers that commit, and both used to
# run the full 7-job matrix on every push. Only push pipelines are dropped:
# schedules, API and web pipelines on the same branch still run.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # A conflicted MR gets no MR pipeline (GitLab behavior), so pushes to it run
    # nothing until the conflict is resolved. Accepted: the merge is blocked anyway.
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

.mr-and-branch: &mr-and-branch
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  - if: '$CI_COMMIT_BRANCH'
  - if: '$CI_COMMIT_TAG'

lint:
  stage: quality
  image: node:${NODE_VERSION}
  extends: .node-matrix
  rules: *mr-and-branch
  cache:
    key: "${CI_COMMIT_REF_SLUG}-${NODE_VERSION}"
    paths:
      - node_modules/
  script:
    - npm run lint

typecheck:
  stage: quality
  image: node:20
  rules: *mr-and-branch
  cache:
    key: "${CI_COMMIT_REF_SLUG}-20"
    paths:
      - node_modules/
  script:
    - npm run typecheck

build:
  stage: build
  image: node:${NODE_VERSION}
  extends: .node-matrix
  rules: *mr-and-branch
  needs:
    - lint
  cache:
    key: "${CI_COMMIT_REF_SLUG}-${NODE_VERSION}"
    paths:
      - node_modules/
    policy: pull-push
  artifacts:
    paths:
      - dist/
      - data/
    expire_in: 1 hour
  script:
    - npm run build

test:
  stage: test
  image: node:${NODE_VERSION}
  extends: .node-matrix
  rules: *mr-and-branch
  needs:
    - build
  cache:
    key: "${CI_COMMIT_REF_SLUG}-${NODE_VERSION}"
    paths:
      - node_modules/
    policy: pull
  script:
    - npm test

# The shipped action bundle is committed, so a source change without a
# rebuild (or a bundle that was never added) fails the MR, not the release.
action-bundle:
  stage: test
  image: node:20
  rules: *mr-and-branch
  needs:
    - build
  cache:
    key: "${CI_COMMIT_REF_SLUG}-20"
    paths:
      - node_modules/
    policy: pull
  script:
    - npm run build:action
    - git diff --exit-code action/dist
    - test -z "$(git status --porcelain action/dist)"

audit:
  stage: audit
  image: node:20
  rules: *mr-and-branch
  cache:
    key: "${CI_COMMIT_REF_SLUG}-20"
    paths:
      - node_modules/
    policy: pull
  # Fails on any high or critical runtime advisory that is not listed in
  # scripts/audit-accepted.json (owner and review date required).
  script:
    - node scripts/audit-gate.mjs

# Manual only: scans the top MCP server packages on npm/PyPI for the
# ThynkQ ecosystem campaign. No tags, so it lands on shared runners like
# every other job here (this project has shared_runners_enabled).
# Non-gating by design (manual + allow_failure): a 60-minute live-network
# run that produces campaign data, not a check on the code in an MR. It is
# not coverage and must never be counted as a gate.
ecosystem-scan:
  stage: ecosystem
  image: node:20
  cache:
    key: "${CI_COMMIT_REF_SLUG}-20"
    paths:
      - node_modules/
    policy: pull
  timeout: 60m
  # Own retry block: the 60m job must never be retried into hours.
  retry: 0
  interruptible: true
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: manual
  artifacts:
    paths:
      - out/ecosystem/
    expire_in: 7 days
  script:
    - npm run build
    - node scripts/top-mcp-packages.mjs
    - node scripts/ecosystem-scan.mjs
